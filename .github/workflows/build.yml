name: Build KaamSetu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE="KaamSetu-Android-Cloud-Build-Ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found!"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_DIR=$(find source -type f -name "settings.gradle.kts" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build KaamSetu APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          echo "SUCCESS: APK generated!"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaamSetu-debug-apk
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          


    
    





      









          






















     


