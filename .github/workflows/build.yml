name: Build KaamSetu Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build KaamSetu APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/kaamsetu/app

          cp app/MainActivity.kt \
            app/src/main/java/com/kaamsetu/app/MainActivity.kt

          cp app/AndroidManifest.xml \
            app/src/main/AndroidManifest.xml

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/kaamsetu/app/MainActivity.kt

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload KaamSetu APK
        uses: actions/upload-artifact@v4
        with:
          name: KaamSetu-Email-Password-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

    
    





      









          






















     


