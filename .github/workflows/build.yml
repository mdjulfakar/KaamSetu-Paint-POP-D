
name: Build KaamSetu Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android Project ZIP
        run: |
          test -f KaamSetu-Android-Cloud-Build-Ready.zip

      - name: Extract Android Project
        run: |
          mkdir -p extracted
          unzip -q KaamSetu-Android-Cloud-Build-Ready.zip -d extracted
          test -f extracted/KaamSetu-Android-Cloud-Build-Ready/settings.gradle.kts

      - name: Build Debug APK
        working-directory: extracted/KaamSetu-Android-Cloud-Build-Ready
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaamSetu-Debug-APK
          path: extracted/KaamSetu-Android-Cloud-Build-Ready/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


    
    





      









          






















     


