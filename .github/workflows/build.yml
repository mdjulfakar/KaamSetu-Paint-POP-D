
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project
        run: |
          mkdir -p extracted_zip
          if [ -f "KaamSetu-Android-Cloud-Build-Ready.zip" ]; then
            unzip -o KaamSetu-Android-Cloud-Build-Ready.zip -d extracted_zip
          else
            find . -name "KaamSetu-Android-Cloud-Build-Ready.zip" -exec unzip -o {} -d extracted_zip \;
          fi

      - name: Force Strict Java 17 Build
        run: |
          PROJECT_ROOT=$(find extracted_zip -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Could not locate Gradle project root."
            exit 1
          fi
          echo "Building in: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          echo "Configuring properties for strict 17..."
          echo "org.gradle.java.home=$JAVA_HOME" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" >> gradle.properties

          echo "Running Gradle build..."
          gradle assembleDebug --no-daemon \
            -Dorg.gradle.java.home=$JAVA_HOME \
            -Pandroid.compileOptions.sourceCompatibility=VERSION_17 \
            -Pandroid.compileOptions.targetCompatibility=VERSION_17 \
            -Pkotlin.jvm.target=17

















     


