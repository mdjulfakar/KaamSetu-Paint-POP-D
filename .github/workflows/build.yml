name: Build KaamSetu APK

on:
workflow_dispatch:
push:
branches: ["main"]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract Android source ZIP
    run: |
      unzip -q KaamSetu-Android-Cloud-Build-Ready.zip -d source
      PROJECT_DIR="$(find source -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
      test -n "$PROJECT_DIR"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Build debug APK
    run: gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleDebug

  - name: Verify APK exists
    run: test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

  - name: Upload installable debug APK
    uses: actions/upload-artifact@v4
    with:
      name: KaamSetu-debug-apk
      path: source/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14


    
    





      









          






















     


