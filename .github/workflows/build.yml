
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Direct Android SDK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad16b54b8faa38f4d4a04064f57c28e83c0" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479751e6027bb1c9079a79895057228a" >> "$ANDROID_HOME/licenses/android-sdk-license"
          PROJECT_ROOT=$(find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          else
            PROJECT_ROOT=$(dirname "$PROJECT_ROOT")
          fi
          echo "Building in: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi
          gradle assembleDebug --no-daemon 

    
    





      









          






















     


