
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project
        run: |
          mkdir -p extracted_zip
          if [ -f "KaamSetu-Android-Cloud-Build-Ready.zip" ]; then
            unzip -o KaamSetu-Android-Cloud-Build-Ready.zip -d extracted_zip
          else
            find . -name "KaamSetu-Android-Cloud-Build-Ready.zip" -exec unzip -o {} -d extracted_zip \;
          fi

      - name: Overwrite JVM Config and Build
        run: |
          PROJECT_ROOT=$(find extracted_zip -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Could not locate Gradle project root."
            exit 1
          fi
          echo "Building in: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          echo "Writing strict Java 17 and AndroidX configuration..."
          echo "org.gradle.java.home=$JAVA_HOME" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaamSetu-app
          path: |
            **/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error














     


