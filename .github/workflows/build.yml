name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir -p android-project
          unzip -o KaamSetu-Android-Cloud-Build-Ready.zip -d android-project

      - name: Find Gradle and Build APK
        run: |
          GRADLE_FILE=$(find android-project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew file not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KaamSetu-app
          path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


