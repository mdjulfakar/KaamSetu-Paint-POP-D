
      - name: Build with Direct Android SDK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          PROJECT_ROOT=$(find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          else
            PROJECT_ROOT=$(dirname "$PROJECT_ROOT")
          fi
          echo "Building in: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi
          echo "org.gradle.java.home=$JAVA_HOME" > gradle.properties
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi







          






















     


